name: CD - Deploy to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout the repository

jobs:
  deploy:
    name: Deploy to AWS S3 & CloudFront CDN
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ vars.WEBSITE_URL || 'https://granulesindia.com' }}
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Strict Typecheck
        run: npm run typecheck

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🔑 Configure AWS Credentials (OIDC or Secret Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: ☁️ Sync Assets to S3 with Long-Term Cache
        run: |
          S3_BUCKET="${{ secrets.AWS_S3_BUCKET || vars.AWS_S3_BUCKET }}"
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::AWS_S3_BUCKET secret/variable is not set."
            exit 1
          fi

          echo "🚀 Deploying immutable hashed assets to s3://$S3_BUCKET/assets/ ..."
          if [ -d "dist/assets" ]; then
            aws s3 sync dist/assets/ "s3://$S3_BUCKET/assets/" \
              --cache-control "public, max-age=31536000, immutable" \
              --delete
          fi

      - name: ☁️ Sync Documents & Media Assets to S3
        run: |
          S3_BUCKET="${{ secrets.AWS_S3_BUCKET || vars.AWS_S3_BUCKET }}"
          
          # Sync public documents if present
          if [ -d "dist/documents" ]; then
            echo "📄 Syncing documents to s3://$S3_BUCKET/documents/ ..."
            aws s3 sync dist/documents/ "s3://$S3_BUCKET/documents/" \
              --cache-control "public, max-age=86400"
          fi

      - name: ☁️ Sync Root HTML & Static Files (No-Cache for Instant Refresh)
        run: |
          S3_BUCKET="${{ secrets.AWS_S3_BUCKET || vars.AWS_S3_BUCKET }}"
          
          echo "🌐 Syncing root files and index.html to s3://$S3_BUCKET/ ..."
          aws s3 sync dist/ "s3://$S3_BUCKET/" \
            --exclude "assets/*" \
            --cache-control "public, max-age=0, no-cache, no-store, must-revalidate" \
            --delete

      - name: 🔄 Invalidate CloudFront CDN Cache
        id: invalidate_cache
        run: |
          DISTRIBUTION_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -n "$DISTRIBUTION_ID" ]; then
            echo "🚀 Creating CloudFront cache invalidation for distribution $DISTRIBUTION_ID ..."
            INVALIDATION_ID=$(aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*" \
              --query "Invalidation.Id" \
              --output text)
            echo "✅ Invalidation created successfully with ID: $INVALIDATION_ID"
            echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ CLOUDFRONT_DISTRIBUTION_ID not specified; skipping CDN cache invalidation."
            echo "invalidation_id=N/A" >> "$GITHUB_OUTPUT"
          fi

      - name: 📊 Deployment Summary Report
        run: |
          echo "### 🚀 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment:** \`${{ inputs.environment || 'production' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket:** \`${{ secrets.AWS_S3_BUCKET || vars.AWS_S3_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS Region:** \`${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Invalidation ID:** \`${{ steps.invalidate_cache.outputs.invalidation_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** \`${{ github.actor }}\` via \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Live Website URL:** [${{ vars.WEBSITE_URL || 'https://granulesindia.com' }}](${{ vars.WEBSITE_URL || 'https://granulesindia.com' }})" >> $GITHUB_STEP_SUMMARY
